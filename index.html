<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шеф-бот</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #ff6b35;
    --accent2: #ffd60a;
    --text: #f0f0f0;
    --muted: #888;
    --green: #4ade80;
    --radius: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }

  .header { text-align: center; margin-bottom: 28px; padding-top: 8px; }
  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px; }

  .kbju-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .kbju-bar label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  .kbju-inputs { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
  .kbju-field { display: flex; flex-direction: column; gap: 3px; }
  .kbju-field span { font-size: 0.65rem; color: var(--muted); }
  .kbju-field input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.85rem;
    padding: 5px 8px;
    width: 72px;
    outline: none;
  }
  .kbju-field input:focus { border-color: var(--accent); }
  .mode-toggle { display: flex; gap: 6px; }
  .mode-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .tabs { display: flex; gap: 4px; background: var(--surface); border-radius: var(--radius); padding: 5px; }
  .tab {
    flex: 1; padding: 9px 8px; border: none; border-radius: 10px;
    background: transparent; color: var(--muted); font-size: 0.8rem;
    cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;
    text-align: center; font-weight: 500;
  }
  .tab.active { background: var(--surface2); color: var(--text); }
  .tab:hover:not(.active) { color: var(--text); }

  .panel { display: none; flex-direction: column; gap: 12px; }
  .panel.active { display: flex; }

  .input-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .input-area label { font-size: 0.8rem; color: var(--muted); }
  textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    line-height: 1.5;
    padding: 10px 12px;
    resize: vertical;
    min-height: 80px;
    outline: none;
    width: 100%;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .format-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .fmt-btn {
    padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 0.78rem;
    cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;
  }
  .fmt-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(255,107,53,0.08); }

  .gen-btn {
    background: linear-gradient(135deg, var(--accent), #ff8c5a);
    border: none; border-radius: 12px; color: #fff;
    font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700;
    padding: 13px; cursor: pointer; transition: all 0.2s; width: 100%;
    letter-spacing: 0.3px;
  }
  .gen-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  .result-box.visible { display: flex; }
  .result-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .result-title { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; }
  .kbju-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; }
  .pill.kcal { background: rgba(255,214,10,0.15); color: var(--accent2); border: 1px solid rgba(255,214,10,0.3); }
  .pill.protein { background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid rgba(74,222,128,0.25); }
  .pill.fat { background: rgba(251,146,60,0.12); color: #fb923c; border: 1px solid rgba(251,146,60,0.25); }
  .pill.carb { background: rgba(147,197,253,0.12); color: #93c5fd; border: 1px solid rgba(147,197,253,0.25); }
  .result-body { font-size: 0.88rem; line-height: 1.8; color: #d0d0d0; white-space: pre-wrap; }

  .db-header { display: flex; justify-content: space-between; align-items: center; }
  .db-header h3 { font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; }
  .db-count { font-size: 0.75rem; color: var(--muted); }
  .db-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
  .db-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .db-item-info { flex: 1; }
  .db-item-name { font-size: 0.88rem; font-weight: 600; margin-bottom: 2px; }
  .db-item-meta { font-size: 0.72rem; color: var(--muted); }
  .db-item-use {
    padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 0.72rem;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
    font-family: 'Inter', sans-serif;
  }
  .db-item-use:hover { border-color: var(--accent); color: var(--accent); }

  .loading { display: none; align-items: center; gap: 10px; color: var(--muted); font-size: 0.85rem; padding: 8px 0; }
  .loading.visible { display: flex; }
  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .db-empty { color: var(--muted); font-size: 0.82rem; text-align: center; padding: 24px 0; }
  .error-msg { color: #f87171; font-size: 0.82rem; padding: 6px 0; display: none; }
  .error-msg.visible { display: block; }

  .save-btn {
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 12px;
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
  }
  .save-btn:hover { background: rgba(255,107,53,0.1); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div class="header">
  <h1>🔥 Шеф-бот</h1>
  <p>Вкусно. В КБЖУ. Без лишнего.</p>
</div>

<div class="container">

  <div class="kbju-bar">
    <label>Цель</label>
    <div class="mode-toggle">
      <button class="mode-btn active" onclick="setMode('cut', this)">Сушка</button>
      <button class="mode-btn" onclick="setMode('bulk', this)">Набор</button>
    </div>
    <div class="kbju-inputs">
      <div class="kbju-field"><span>Ккал</span><input type="number" id="kcal" value="2000"></div>
      <div class="kbju-field"><span>Белок г</span><input type="number" id="protein" value="180"></div>
      <div class="kbju-field"><span>Жир г</span><input type="number" id="fat" value="60"></div>
      <div class="kbju-field"><span>Углей г</span><input type="number" id="carbs" value="180"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('fridge', this)">🧊 Из холодильника</button>
    <button class="tab" onclick="switchTab('plan', this)">📅 План на день</button>
    <button class="tab" onclick="switchTab('db', this)">📚 Моя база</button>
  </div>

  <!-- Из холодильника -->
  <div class="panel active" id="tab-fridge">
    <div class="input-area">
      <label>Что есть в холодильнике?</label>
      <textarea id="fridge-input" placeholder="Например: куриная грудка, яйца, брокколи, рис, греческий йогурт, чеснок, лимон..."></textarea>
      <div>
        <label style="margin-bottom:6px;display:block">Формат приготовления:</label>
        <div class="format-row" id="fmt-row">
          <button class="fmt-btn active" data-fmt="quick">⚡ Быстро (до 15 мин)</button>
          <button class="fmt-btn" data-fmt="normal">🍳 Нормально (30–40 мин)</button>
          <button class="fmt-btn" data-fmt="prep">📦 Заготовка на 3–5 дней</button>
          <button class="fmt-btn" data-fmt="all">🎯 Все варианты</button>
        </div>
      </div>
    </div>
    <div class="loading" id="fridge-loading"><div class="spinner"></div><span>Шеф думает...</span></div>
    <div class="error-msg" id="fridge-error"></div>
    <button class="gen-btn" onclick="generateFridge()">Придумать рецепт</button>
    <div class="result-box" id="fridge-result">
      <div class="result-header">
        <div class="result-title">Рецепт готов 👨‍🍳</div>
        <div class="kbju-pills" id="fridge-pills"></div>
      </div>
      <div class="result-body" id="fridge-result-body"></div>
      <button class="save-btn" onclick="saveCurrentRecipe()">💾 Сохранить в мою базу</button>
    </div>
  </div>

  <!-- План на день -->
  <div class="panel" id="tab-plan">
    <div class="input-area">
      <label>Пожелания (необязательно)</label>
      <textarea id="plan-input" placeholder="Например: без глютена, не люблю рыбу, хочу 4 приёма пищи..." style="min-height:60px"></textarea>
    </div>
    <div class="loading" id="plan-loading"><div class="spinner"></div><span>Составляю меню...</span></div>
    <div class="error-msg" id="plan-error"></div>
    <button class="gen-btn" onclick="generatePlan()">Составить план питания</button>
    <div class="result-box" id="plan-result">
      <div class="result-header"><div class="result-title">📅 Меню на день</div></div>
      <div class="result-body" id="plan-result-body"></div>
    </div>
  </div>

  <!-- База рецептов -->
  <div class="panel" id="tab-db">
    <div class="input-area">
      <label>Добавить рецепт вручную</label>
      <textarea id="manual-recipe" placeholder="Вставь текст рецепта — название, ингредиенты, способ приготовления..."></textarea>
      <div class="loading" id="db-loading"><div class="spinner"></div><span>Анализирую рецепт...</span></div>
      <div class="error-msg" id="db-error"></div>
      <button class="gen-btn" onclick="saveManual()" style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">Сохранить в базу</button>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;">
      <div class="db-header">
        <h3>Мои рецепты</h3>
        <span class="db-count" id="db-count">0 рецептов</span>
      </div>
      <div class="db-list" id="db-list">
        <div class="db-empty">База пуста. Добавь первый рецепт!</div>
      </div>
    </div>
  </div>

</div>

<script>
  const PROXY_URL = "https://chefbot-proxy.ponomarevbogdan2013.workers.dev";

  let currentMode = 'cut';
  let currentFmt = 'quick';
  let lastRecipeText = '';
  let recipeDB = JSON.parse(localStorage.getItem('chefbot_db') || '[]');

  // Вызов Gemini API
  async function callGemini(prompt) {
    const response = await fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.8, maxOutputTokens: 1500 }
      })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    return data.candidates[0].content.parts[0].text;
  }

  // Режим
  function setMode(mode, btn) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (mode === 'cut') {
      document.getElementById('kcal').value = 2000;
      document.getElementById('protein').value = 180;
      document.getElementById('fat').value = 60;
      document.getElementById('carbs').value = 180;
    } else {
      document.getElementById('kcal').value = 2800;
      document.getElementById('protein').value = 160;
      document.getElementById('fat').value = 90;
      document.getElementById('carbs').value = 300;
    }
  }

  // Табы
  function switchTab(tab, btn) {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'db') renderDB();
  }

  // Формат
  document.getElementById('fmt-row').addEventListener('click', e => {
    const btn = e.target.closest('.fmt-btn');
    if (!btn) return;
    document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFmt = btn.dataset.fmt;
  });

  // КБЖУ контекст
  function getKBJU() {
    return {
      kcal: document.getElementById('kcal').value,
      protein: document.getElementById('protein').value,
      fat: document.getElementById('fat').value,
      carbs: document.getElementById('carbs').value,
      mode: currentMode === 'cut' ? 'сушка (дефицит калорий)' : 'набор массы (профицит)'
    };
  }

  function fmtLabel() {
    const map = {
      quick: 'быстрый (до 15 минут)',
      normal: 'обычный (30–40 минут)',
      prep: 'заготовка на 3–5 дней (несколько порций)',
      all: 'три варианта: быстрый, обычный и заготовка на несколько дней'
    };
    return map[currentFmt];
  }

  // Извлечь КБЖУ из текста
  function extractKBJU(text) {
    const kcal = text.match(/(\d+)\s*ккал/i)?.[1];
    const prot = text.match(/Б\s*(\d+)/i)?.[1] || text.match(/белок[:\s]+(\d+)/i)?.[1];
    const fat  = text.match(/Ж\s*(\d+)/i)?.[1] || text.match(/жир[:\s]+(\d+)/i)?.[1];
    const carb = text.match(/У\s*(\d+)/i)?.[1] || text.match(/углев[а-я]+[:\s]+(\d+)/i)?.[1];
    return { kcal, prot, fat, carb };
  }

  function renderPills(container, kbju) {
    container.innerHTML = '';
    if (kbju.kcal) container.innerHTML += `<span class="pill kcal">${kbju.kcal} ккал</span>`;
    if (kbju.prot) container.innerHTML += `<span class="pill protein">Б ${kbju.prot}г</span>`;
    if (kbju.fat)  container.innerHTML += `<span class="pill fat">Ж ${kbju.fat}г</span>`;
    if (kbju.carb) container.innerHTML += `<span class="pill carb">У ${kbju.carb}г</span>`;
  }

  // Из холодильника
  async function generateFridge() {
    const ingredients = document.getElementById('fridge-input').value.trim();
    if (!ingredients) { showError('fridge-error', 'Укажи что есть в холодильнике'); return; }

    const k = getKBJU();
    const dbNames = recipeDB.map(r => r.name).join(', ');
    const dbHint = dbNames ? `\nВ базе уже есть рецепты: ${dbNames}. Предложи что-то другое или похожее по технике.` : '';

    setLoading('fridge', true);
    hideError('fridge-error');
    document.getElementById('fridge-result').classList.remove('visible');

    try {
      const prompt = `Ты шеф-повар который готовит очень вкусно — как крутые фуд-блогеры. Ярко, сочно, с балансом вкусов. Без пафоса — просто реально вкусно.

Пользователь на ${k.mode}.
Цели: ${k.kcal} ккал, белок ${k.protein}г, жир ${k.fat}г, углеводы ${k.carbs}г.
${dbHint}

Доступные ингредиенты: ${ingredients}
Формат: ${fmtLabel()}

Ответь строго в таком формате:

🍽 НАЗВАНИЕ БЛЮДА

💬 Почему вкусно (1-2 предложения про вкусовой баланс и текстуры)

📦 Ингредиенты (с точными граммами на порцию):
• ...

👨‍🍳 Приготовление:
1. ...

📊 КБЖУ на порцию: X ккал / Б Xг / Ж Xг / У Xг

🔥 Фишка шефа: что делает это блюдо реально вкусным

Пиши по-русски. Конкретные граммы обязательно.`;

      const text = await callGemini(prompt);
      lastRecipeText = text;

      document.getElementById('fridge-result-body').textContent = text;
      renderPills(document.getElementById('fridge-pills'), extractKBJU(text));
      document.getElementById('fridge-result').classList.add('visible');
    } catch(e) {
      showError('fridge-error', 'Ошибка: ' + e.message);
    } finally {
      setLoading('fridge', false);
    }
  }

  // Сохранить текущий рецепт
  async function saveCurrentRecipe() {
    if (!lastRecipeText) return;
    await parseAndSave(lastRecipeText);
  }

  // Сохранить вручную
  async function saveManual() {
    const text = document.getElementById('manual-recipe').value.trim();
    if (!text) { showError('db-error', 'Вставь текст рецепта'); return; }
    setLoading('db', true);
    hideError('db-error');
    await parseAndSave(text);
    document.getElementById('manual-recipe').value = '';
    setLoading('db', false);
  }

  // Парсинг и сохранение рецепта
  async function parseAndSave(text) {
    try {
      const prompt = `Из этого текста извлеки рецепт и верни ТОЛЬКО JSON без markdown:
{
  "name": "название блюда",
  "ingredients": ["ингредиент с граммами"],
  "time": "время приготовления",
  "kcal": число или null,
  "tags": ["тег"],
  "summary": "одно предложение о блюде"
}

Текст: ${text}`;

      const response = await callGemini(prompt);
      const clean = response.replace(/```json|```/g, '').trim();
      let data;
      try { data = JSON.parse(clean); }
      catch { data = { name: text.split('\n')[0].replace('🍽','').trim().substring(0,50), ingredients: [], time: '?', kcal: null, tags: [], summary: '' }; }

      const recipe = {
        id: Date.now(),
        name: data.name || 'Рецепт',
        ingredients: data.ingredients || [],
        time: data.time || '?',
        kcal: data.kcal,
        tags: data.tags || [],
        summary: data.summary || '',
        addedAt: new Date().toLocaleDateString('ru')
      };

      recipeDB.unshift(recipe);
      localStorage.setItem('chefbot_db', JSON.stringify(recipeDB));
      renderDB();
      switchTab('db', document.querySelectorAll('.tab')[2]);
    } catch(e) {
      showError('db-error', 'Ошибка сохранения: ' + e.message);
    }
  }

  // План на день
  async function generatePlan() {
    const k = getKBJU();
    const prefs = document.getElementById('plan-input').value.trim();
    const dbNames = recipeDB.map(r => r.name).join(', ');
    const dbHint = dbNames ? `\nВключи 1-2 блюда из базы пользователя если подходят: ${dbNames}` : '';

    setLoading('plan', true);
    hideError('plan-error');
    document.getElementById('plan-result').classList.remove('visible');

    try {
      const prompt = `Ты нутрициолог и шеф-повар. Составь меню на день — вкусное, реалистичное, с точным попаданием в КБЖУ.

Режим: ${k.mode}
Цели: ${k.kcal} ккал, белок ${k.protein}г, жир ${k.fat}г, углеводы ${k.carbs}г
${prefs ? `Пожелания: ${prefs}` : ''}${dbHint}

Формат:

🌅 ЗАВТРАК (~XX ккал)

  // Рендер базы
  function renderDB() {
    const list = document.getElementById('db-list');
    document.getElementById('db-count').textContent = recipeDB.length + ' рецептов';
    if (!recipeDB.length) {
      list.innerHTML = '<div class="db-empty">База пуста. Добавь первый рецепт!</div>';
      return;
    }
    list.innerHTML = recipeDB.map(r => `
      <div class="db-item">
        <div class="db-item-info">
          <div class="db-item-name">${r.name}</div>
          <div class="db-item-meta">${r.time} · ${r.kcal ? r.kcal+'ккал · ' : ''}добавлен ${r.addedAt}</div>
          ${r.summary ? `<div class="db-item-meta" style="margin-top:2px;font-style:italic">${r.summary}</div>` : ''}
        </div>
        <button class="db-item-use" onclick="useRecipe(${r.id})">Готовить</button>
      </div>
    `).join('');
  }

  function useRecipe(id) {
    const r = recipeDB.find(x => x.id === id);
    if (!r) return;
    document.getElementById('fridge-input').value = r.ingredients.join(', ');
    switchTab('fridge', document.querySelectorAll('.tab')[0]);
  }

  // Helpers
  function setLoading(id, show) {
    document.getElementById(id + '-loading').classList.toggle('visible', show);
    const btn = document.querySelector('#tab-' + id + ' .gen-btn');
    if (btn) btn.disabled = show;
  }
  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.classList.add('visible');
  }
  function hideError(id) {
    document.getElementById(id).classList.remove('visible');
  }

  renderDB();
</script>
